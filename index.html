<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pallet Tracking - Level 2 Supabase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- NAVBAR HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base md:text-lg leading-tight tracking-wide">PALLET TRACKING L2</h1>
          <p class="text-xs text-blue-400 font-medium">Powered by Supabase Engine</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 bg-emerald-500/10 px-3 py-1.5 rounded-full text-xs font-semibold text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Ultra-Fast DB</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-4xl mx-auto w-full px-4 py-5 flex-1 space-y-4">

    <!-- STATS CARDS -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/80 shadow-lg">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Total Palet</div>
        <div class="text-xl md:text-2xl font-extrabold text-white" id="stat-total">-</div>
      </div>

      <div onclick="openGudangModal()" class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/80 shadow-lg hover:border-emerald-500/50 hover:bg-slate-800/80 cursor-pointer transition-all">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Gudang</span>
          <i class="fa-solid fa-circle-info text-emerald-400/50 text-xs"></i>
        </div>
        <div class="text-xl md:text-2xl font-extrabold text-emerald-400" id="stat-gudang">-</div>
        <p class="text-[9px] text-slate-400 mt-0.5">Klik rincian</p>
      </div>

      <div onclick="openCustomerModal()" class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/80 shadow-lg hover:border-blue-500/50 hover:bg-slate-800/80 cursor-pointer transition-all">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Customer</span>
          <i class="fa-solid fa-chart-pie text-blue-400/50 text-xs"></i>
        </div>
        <div class="text-xl md:text-2xl font-extrabold text-blue-400" id="stat-customer">-</div>
        <p class="text-[9px] text-blue-300 mt-0.5 font-medium">Klik rincian &rarr;</p>
      </div>
    </div>

    <!-- MAIN FORM & SCANNER CARD -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700/80 shadow-xl overflow-hidden p-5 space-y-4">
      
      <!-- STEP 1: FORM TRANSAKSI -->
      <div id="step-header" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Jenis Transaksi</label>
          <select id="jenisTransaksi" onchange="toggleCustomerSelect()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-blue-500 transition-all">
            <option value="GATE-OUT (PENGIRIMAN)">GATE-OUT (PENGIRIMAN KE CUSTOMER)</option>
            <option value="GATE-IN (PENGEMBALIAN)">GATE-IN (PENGEMBALIAN KE GUDANG)</option>
          </select>
        </div>

        <div id="container-customer">
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Lokasi Tujuan Customer</label>
          <select id="lokasiCustomer" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-blue-500 transition-all">
            <option value="">-- Memuat Customer... --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Nomor Job / Surat Jalan</label>
          <input type="text" id="jobNo" placeholder="Contoh: SJ-2026-001" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-blue-500 transition-all">
        </div>

        <button onclick="goToScanStep()" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
          <span>Buka Kamera Pemindai</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- STEP 2: CAMERA & CONTINUOUS SCAN -->
      <div id="step-scan" class="hidden space-y-4">
        <!-- AREA PEMINDAI KAMERA -->
        <div id="reader" class="w-full rounded-2xl overflow-hidden border-2 border-dashed border-slate-600"></div>

        <!-- COUNTER BAR -->
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-700">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-barcode text-blue-400"></i>
            <span class="text-sm font-semibold text-slate-300">Ter-scan:</span>
            <span id="scan-count" class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-full">0</span>
          </div>
          <button onclick="resetScannedList()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold flex items-center gap-1">
            <i class="fa-solid fa-rotate-left"></i> Reset
          </button>
        </div>

        <!-- LIST PALET -->
        <div id="pallet-list" class="max-h-48 overflow-y-auto border border-slate-700 p-2 rounded-xl bg-slate-900/50 space-y-1.5">
          <div class="text-slate-500 text-center py-4 text-xs">Belum ada barcode di-scan</div>
        </div>

        <!-- SUBMIT -->
        <button id="btn-submit" onclick="submitData()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Simpan Transaksi (Supabase)</span>
        </button>

        <button onclick="backToHeader()" class="w-full text-xs text-slate-400 hover:text-white font-medium py-2 transition-colors">
          &larr; Kembali ke Form Header
        </button>
      </div>

    </div>
  </main>

  <!-- MODAL POPUP: BREAKDOWN PALET CUSTOMER -->
  <div id="modal-customer" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/90 sticky top-0">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg">
            <i class="fa-solid fa-building-user text-base"></i>
          </div>
          <div>
            <h3 class="font-bold text-white text-sm">Sebaran Palet di Customer</h3>
            <p class="text-xs text-slate-400">Total: <span id="modal-cust-total" class="text-blue-400 font-bold">0</span> Unit</p>
          </div>
        </div>
        <button onclick="closeCustomerModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-cust-list" class="p-4 overflow-y-auto space-y-3 text-sm flex-1"></div>
    </div>
  </div>

  <!-- MODAL POPUP: RINCIAN PALET GUDANG -->
  <div id="modal-gudang" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/90 sticky top-0">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg">
            <i class="fa-solid fa-warehouse text-base"></i>
          </div>
          <div>
            <h3 class="font-bold text-white text-sm">Palet Standby di Gudang</h3>
            <p class="text-xs text-slate-400">Total: <span id="modal-gudang-total" class="text-emerald-400 font-bold">0</span> Unit</p>
          </div>
        </div>
        <button onclick="closeGudangModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-gudang-list" class="p-4 overflow-y-auto text-sm flex-1"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
    <span id="toast-msg" class="text-sm font-medium">Notifikasi</span>
  </div>

  <script>
    const SUPABASE_URL = 'https://hfgpbykeehickbajocbk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZ3BieWtlZWhpY2tiYWpvY2JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjk5NzgsImV4cCI6MjEwNjgwNTk3OH0.ovaMvzuW-afaYsEogBhYwBrzyPz2ePAFf4fHTGbKhOs';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let scannedPallets
